<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><title>MyFit</title><style>
:root{font-family:system-ui,Arial;background:#0b1220;color:#eaf0fa}*{box-sizing:border-box}body{margin:0;padding:18px 16px 90px;max-width:760px;margin:auto}h1{font-size:30px;margin:5px 0}h2{font-size:20px}p,small{color:#aabbd0}header{display:flex;justify-content:space-between;align-items:center}.tag{background:#15394b;color:#7de2d3;border-radius:40px;padding:7px 12px;font-size:12px}.card{background:#172338;border:1px solid #304057;border-radius:16px;padding:16px;margin:12px 0}.tabs{display:flex;gap:8px;overflow:auto;margin:20px 0}.tabs button{white-space:nowrap}.btn,button{background:#263c55;color:white;border:1px solid #4c6680;border-radius:10px;padding:10px 12px;font-weight:600}.primary{background:#15b8a6;color:#031a1b;border:0}input{background:#0b1526;border:1px solid #496078;color:white;border-radius:8px;padding:10px;width:100%;font-size:16px}.exercise{border-top:1px solid #32435b;padding:13px 0}.exercise:first-child{border-top:0}.muted{color:#aabbd0}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stats .card{margin:0}strong.value{font-size:24px;display:block;margin:6px 0}details summary{cursor:pointer;padding:8px 0}.bottom{position:fixed;bottom:0;left:0;right:0;background:#101b2c;padding:10px;display:flex;justify-content:center;gap:8px}.bottom button{flex:1;max-width:190px}label{font-size:12px;color:#b9c9d9}.hidden{display:none}textarea{width:100%;background:#0b1526;color:white;border:1px solid #496078;border-radius:8px;padding:10px;min-height:85px}
</style></head><body><header><div><small>YOUR TRAINING COMPANION</small><h1>MyFit <span style="color:#21c8b8">●</span></h1></div><span class="tag">OFFLINE</span></header><p>Build strength. Track consistency. See progress.</p><div id="main"></div><div class="bottom"><button onclick="tab('workouts')">Workouts</button><button onclick="tab('progress')">Progress</button><button onclick="tab('history')">History</button></div><script>
const plans={A:[['Machine / Dumbbell Chest Press','3 × 8–12','Keep shoulders back; lower with control and press without bouncing.'],['Cable Fly (High to Low)','3 × 10–15','Soft elbows; bring hands down and together, avoiding shoulder strain.'],['Push-up','2 × 8–15','Brace core, lower chest under control, maintain straight body.'],['Lat Pulldown','3 × 8–12','Pull elbows toward ribs; avoid swinging.'],['Machine Row','3 × 8–12','Keep chest stable; pull elbows back and squeeze shoulder blades.'],['Single-arm Dumbbell Row','2 × 10–12','Support torso and pull elbow toward hip.']],B:[['Hack Squat / Goblet Squat','3 × 8–12','Brace core; knees track with toes; descend comfortably.'],['Romanian Deadlift','3 × 8–12','Hinge at hips with neutral back; feel hamstrings stretch.'],['Leg Press','3 × 10–12','Keep hips on pad and control the depth.'],['Lying Leg Curl','3 × 10–15','Keep hips down; bend knees without swinging.'],['Leg Extension','2 × 12–15','Extend knees smoothly, avoid jerking.'],['Calf Raise','3 × 12–20','Full comfortable range with a pause at the top.']],C:[['Dumbbell Shoulder Press','3 × 8–12','Press overhead with stable trunk; avoid excessive arch.'],['Cable Lateral Raise','3 × 12–15','Raise arm to shoulder level without shrugging.'],['Cable Reverse Fly','3 × 12–15','Open arms with slight elbow bend, keeping shoulders low.'],['Cable Curl','3 × 10–12','Keep upper arms still and curl without swinging.'],['Hammer Curl','2 × 10–12','Neutral grip; control the lowering phase.'],['Triceps Pushdown','3 × 10–15','Keep elbows close and extend fully without shoulder movement.']]};
let logs=JSON.parse(localStorage.getItem('myfit_logs')||'[]');let current='A',section='workouts',rest=0,timer=null;const $=s=>document.querySelector(s);function save(){localStorage.setItem('myfit_logs',JSON.stringify(logs))}function tab(t){section=t;render()}function choose(p){current=p;render()}function startRest(seconds=90){rest=seconds;clearInterval(timer);tick();timer=setInterval(()=>{rest--;tick();if(rest<=0)clearInterval(timer)},1000)}function tick(){const el=$('#rest');if(el)el.textContent=rest>0?`Rest: ${Math.floor(rest/60)}:${String(rest%60).padStart(2,'0')}`:'Rest timer ready'}
function logSet(i){let weight=Number(document.getElementById('w'+i).value),reps=Number(document.getElementById('r'+i).value);if(!Number.isFinite(weight)||weight<0||!Number.isInteger(reps)||reps<1||reps>100){alert('Enter a valid weight and 1–100 reps');return}logs.push({date:new Date().toISOString(),plan:current,exercise:plans[current][i][0],weight,reps});save();startRest();render();alert('Set saved!')}
function render(){const m=$('#main');if(section==='workouts'){m.innerHTML=`<div class="tabs">${Object.keys(plans).map(p=>`<button class="${current===p?'primary':''}" onclick="choose('${p}')">Workout ${p}</button>`).join('')}</div><div class="card"><h2>Workout ${current}</h2><p>${current==='A'?'Chest & Back':current==='B'?'Legs':'Shoulders & Arms'} · ${plans[current].length} exercises</p><div class="row"><button onclick="startRest(60)">60s rest</button><button onclick="startRest(90)">90s rest</button><button onclick="startRest(120)">120s rest</button></div><p id="rest">Rest timer ready</p></div><div class="card">${plans[current].map((e,i)=>`<div class="exercise"><b>${i+1}. ${e[0]}</b><p>${e[1]}</p><details><summary>Technique instructions</summary><p>${e[2]}</p></details><div class="row"><div><label>Weight (kg)</label><input id="w${i}" type="number" min="0" step="0.5" placeholder="0"></div><div><label>Reps</label><input id="r${i}" type="number" min="1" max="100" placeholder="10"></div><button class="primary" onclick="logSet(${i})">+ Set</button></div></div>`).join('')}</div>`;tick()}
else if(section==='progress'){const volume=logs.reduce((a,l)=>a+l.weight*l.reps,0);const days=new Set(logs.map(l=>l.date.slice(0,10))).size;const prs={};logs.forEach(l=>prs[l.exercise]=Math.max(prs[l.exercise]||0,l.weight));m.innerHTML=`<h2>Your Progress</h2><div class="stats"><div class="card"><small>Sets logged</small><strong class="value">${logs.length}</strong></div><div class="card"><small>Training days</small><strong class="value">${days}</strong></div><div class="card"><small>Total volume</small><strong class="value">${Math.round(volume)} kg</strong></div><div class="card"><small>Exercises tracked</small><strong class="value">${Object.keys(prs).length}</strong></div></div><div class="card"><h2>Best logged weights</h2>${Object.entries(prs).map(([k,v])=>`<p>${k}: <b>${v} kg</b></p>`).join('')||'<p>No sets yet.</p>'}</div><div class="card"><h2>Backup</h2><p>Copy this data to a safe location. Paste it back to restore.</p><button onclick="exportData()">Show backup data</button><textarea id="backup" placeholder="Backup JSON appears here, or paste to restore"></textarea><button onclick="importData()">Restore pasted backup</button></div>`}
else {m.innerHTML=`<h2>Workout History</h2><p>Most recent sets first</p>${logs.slice().reverse().map(l=>`<div class="card"><b>${l.exercise}</b><p>Workout ${l.plan} · ${new Date(l.date).toLocaleString()}</p><strong>${l.weight} kg × ${l.reps} reps</strong></div>`).join('')||'<div class="card">No sets logged yet. Start Workout A, B, or C.</div>'}`}}
function exportData(){$('#backup').value=JSON.stringify(logs)}function importData(){try{const d=JSON.parse($('#backup').value);if(!Array.isArray(d)||!d.every(x=>typeof x.exercise==='string'&&typeof x.date==='string'&&typeof x.weight==='number'&&typeof x.reps==='number'))throw Error();if(confirm('Replace your current workout history with this backup?')){logs=d;save();render()}}catch(e){alert('Invalid backup data')}}render();
</script></body></html>
